<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>هلا طلب</title>
</head>
<body>
  <script>
    const androidUrl = "https://play.google.com/store/apps/details?id=com.halatalab.customer";
    const iosUrl = "https://apps.apple.com/us/app/%D9%87%D9%84%D8%A7-%D8%B7%D9%84%D8%A8/id6813266808?l=ar";

    const ua = navigator.userAgent || navigator.vendor || window.opera;

    if (/android/i.test(ua)) {
      window.location.replace(androidUrl);
    } else if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) {
      window.location.replace(iosUrl);
    } else {
      window.location.replace(androidUrl);
    }
  </script>
</body>
</html>
